<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios JavaScript</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #555;
            padding: 10px;
            text-align: center;
        }

        nav button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            cursor: pointer;
            background-color: white;
            border-radius: 5px;
        }

        nav button:hover {
            background-color: lightgray;
        }

        section {
            display: none;
            background-color: rgb(190, 24, 24);
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        .resultado {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <header>
        <h1>Exercícios de JavaScript</h1>
    </header>

    <nav>
        <button onclick="mostrarTela('ex1')">Exercício 1</button>
        <button onclick="mostrarTela('ex2')">Exercício 2</button>
        <button onclick="mostrarTela('ex3')">Exercício 3</button>
        <button onclick="mostrarTela('ex4')">Exercício 4</button>
    </nav>

    <!-- EXERCÍCIO 1 -->
    <section id="ex1">
        <h2>1. Array de nomes</h2>
        <button onclick="mostrarNomes()">Mostrar Nomes</button>
        <p id="resultadoNomes"></p>

    </section>

    <!-- EXERCÍCIO 2 -->
    <section id="ex2">
        <h2>2. 1 até 20</h2>
        <button onclick="mostrarNros()">Mostrar Números</button>
        <p id="resultadoNros"></p>


    </section>

    <!-- EXERCÍCIO 3 -->
    <section id="ex3">
        <h2>Cadastro de Produtos</h2>
        Nome do produto:<input type="text" id="nome" placeholder="Nome do Produto">
        <button onclick="cadastrarProduto()">Cadastrar</button>
        <h3>Produtos Cadastrados</h3>
        <p id="mostraProdutos"></p>


    </section>

    <!-- EXERCÍCIO 4 -->
    <section id="ex4">
        <h2>Cadastro de Compras</h2>
        Item da compra:<input type="text" id="item" placeholder="Item da compra">
        Quantidade:<input type="number" id="qtidade" placeholder="Quantidade">
        Valor:<input type="number" id="valor" placeholder="Valor">
        <button onclick="cadastrarCompra()">Cadastrar</button>
        <h3>Itens da compra</h3>
        <p id="mostraCompra"></p>

    </section>

    <script>

        // MENU
        function mostrarTela(id) {

            let secoes = document.querySelectorAll("section");

            for (let i = 0; i < secoes.length; i++) {

                secoes[i].style.display = "none";
            }

            document.getElementById(id).style.display = "block";
        }

        // Mostrar primeira tela
        mostrarTela("ex1");


        // EXERCÍCIO 1
        function mostrarNomes() {
            let nomes = ["Ana", "José", "Maria", "Fernanda", "João"];
            nomes.push("Julia");
            nomes.push("Marcelio");
            let texto = "";
            for (let i = 0; i < nomes.length; i++) {
                texto += nomes[i] + "<br>";
            }
            document.getElementById("resultadoNomes").innerHTML = texto;
        }


        // EXERCÍCIO 2
        function mostrarNros() {
            let texto = "";
            for (let i = 1; i <= 20; i++) {
                texto += i + "<br>";
            }
            document.getElementById("resultadoNros").innerHTML = texto;

        }

        // EXERCÍCIO 3
        let produtos = [];
        function cadastrarProduto() {
            let prod = document.getElementById("nome").value;
            produtos.push(prod);

            let lista = document.getElementById("mostraProdutos");
            lista.innerHTML = "";
            for (let i = 0; i < produtos.length; i++) {
                lista.innerHTML += "<li>" + produtos[i] + "</li>";
            }
            //limpa a caixa de texto após cadastro
            document.getElementById("nome").value = "";

        }

        // EXERCÍCIO 4
        // array que armazenará os objetos
        let compras = [];
        function cadastrarCompra() {
            // cria um objeto
            let compra = {
                item: document.getElementById("item").value,
                quantidade: Number(document.getElementById("qtidade").value),
                valor: Number(document.getElementById("valor").value),
                total: Number(document.getElementById("qtidade").value) *
                    Number(document.getElementById("valor").value)
            };

            // adiciona o objeto no array
            compras.push(compra);
            // mostra na tela
            let lista = document.getElementById("mostraCompra");

            lista.innerHTML = "";

            for (let i = 0; i < compras.length; i++) {

                lista.innerHTML += `
            <li>
                Produto: ${compras[i].item}
                | Quantidade: ${compras[i].quantidade}
                | Valor: R$ ${compras[i].valor}
                | Total: R$ ${compras[i].total}
            </li>
        `;
            }

            // limpa os campos
            document.getElementById("item").value = "";
            document.getElementById("qtidade").value = "";
            document.getElementById("valor").value = "";

        }


    </script>

</body>

</html>
